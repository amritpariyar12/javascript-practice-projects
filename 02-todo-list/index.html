<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        body{
            font-family: sans-serif;
            text-align: center;
            margin-top: 30px;
        }
        input{
            padding: 10px;
            width: 200px;
        }
        button{
            padding: 10px;
        }
        ul{
           list-style: none;
           padding: 0;
           margin-top: 40px; 
        }
        li{
            padding: 8px 0;
            font-size: 18px;
        }
        .remove{
            color: red;
            cursor: pointer;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <input type="text" id="todoinput" placeholder="Add a task">
    <button id="addBtn">Add</button>
    <ul id="todolist"></ul>

    <script src="script.js"></script>
</body>
</html>
